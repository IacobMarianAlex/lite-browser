plugins {
    id 'com.android.application'
}

android {
    namespace 'ro.lite.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'ro.lite.browser'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        lite {
            storeFile file('litebrowser.jks')
            storePassword 'litebrowser'
            keyAlias 'lite'
            keyPassword 'litebrowser'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // cheie fixa: actualizarile se instaleaza peste versiunea veche, fara sa pierzi login-urile
            signingConfig signingConfigs.lite
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Fara nicio biblioteca externa: aplicatia ramane foarte mica si usoara.
dependencies {
}
